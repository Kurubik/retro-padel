# RETRO//PADEL — compose definition for the existing edge network.
#
# Authored for review. NOT applied by the implementation agent: switching the
# padel.xtr.sh upstream is a separate, reviewed cutover step (see deploy/README.md).
#
# `name:` pins a deliberately unique Compose project. The old PADEL//CLUB stack also
# lives in a directory called deploy/, so without this the resolved project name here
# defaults to "deploy" as well, and a plain `up` in this repository could treat the
# running old service as an orphan of this project. Release commands should pass
# `-p retro-padel` explicitly as well.

name: retro-padel

services:
  retro-padel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: retro-padel:local
    container_name: retro-padel-app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      MAX_ROOMS: "200"
    networks:
      girl_edge:
        # Stable network name for the reviewed Caddy upstream, independent of both
        # the container name and the Compose project name.
        aliases:
          - retro-padel-app
    # No published ports: the shared edge reaches it by network alias only.
    expose:
      - "8080"

networks:
  girl_edge:
    external: true
    name: girl-xtr_girl_edge
