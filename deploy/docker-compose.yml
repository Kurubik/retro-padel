# RETRO//PADEL — compose fragment for the existing edge network.
#
# Authored for review. NOT applied by the implementation agent: switching the
# padel.xtr.sh upstream is a separate, reviewed cutover step (see deploy/README.md).
#
# The service joins the shared external network under its own unique name so it can
# never collide with, or restart, the existing PADEL//CLUB container.

services:
  retro-padel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: retro-padel:local
    container_name: retro-padel-app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      MAX_ROOMS: "200"
    networks:
      - girl_edge
    # No published ports: the shared edge reaches it by network alias only.
    expose:
      - "8080"

networks:
  girl_edge:
    external: true
    name: girl-xtr_girl_edge
